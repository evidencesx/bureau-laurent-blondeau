<main class="apropos boutique">
  <section class="confirmation" id="confirmation" aria-live="polite">
    <h1>Merci&nbsp;!</h1>
    <p id="confirmation-texte">Nous vérifions votre paiement…</p>

<script src="js/scene.js"></script>
<script src="js/achat.js"></script>
<script type="module">
  // Le retour de Stripe ne prouve rien : on demande à la base si le webhook a confirmé le paiement.
  import { baseConfiguree, base, euros } from './js/client.js';
  const p = new URLSearchParams(location.search);
  const texte = document.getElementById('confirmation-texte');
  async function verifier(essai = 0) {
    if (!baseConfiguree || !p.get('commande')) { texte.textContent = 'Aucune commande à vérifier.'; return; }
    const sb = await base();
    const { data } = await sb.rpc('statut_commande', { p_numero: p.get('commande'), p_jeton: p.get('jeton') });
    if (data && data.paiement_statut === 'paye') {
      window.Panier.vider();
      texte.textContent = `Votre commande n° ${data.numero} (${euros(data.total_cents)}) est bien réglée. Un récapitulatif vient de partir vers votre boîte e-mail, et je prépare votre colis.`;
    } else if (essai < 10) {
      setTimeout(() => verifier(essai + 1), 2000);
    } else {
      texte.textContent = 'Le paiement est en cours de validation chez Stripe. Vous recevrez un e-mail dès qu’il sera confirmé. Si rien n’arrive d’ici une heure, écrivez-moi depuis la page Contact.';
    }
  }
  verifier();
</script>
</body>
</html>

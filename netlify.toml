# Site statique, sans étape de construction : Netlify publie le dossier site/ tel quel.
[build]
  publish = "site"

# L’adresse Netlify d’origine renvoie vers le vrai domaine : le paiement et le
# formulaire de contact n’acceptent que laurentblondeau.fr (secret SITE_URL).
[[redirects]]
  from = "https://laurent-blondeau-bureau.netlify.app/*"
  to = "https://laurentblondeau.fr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# L'administration ne doit jamais être indexée, même après l'ouverture du site.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
